<svg xmlns="http://www.w3.org/2000/svg" width="50" height="40" viewBox="0 0 168 40">
  <!-- Background with rounded corners -->
  <rect width="168" height="40" rx="8" ry="8" fill="url(#gradient)" />

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff7eb3; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff758c; stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Centered Text -->
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle" style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);">W2S</text>
</svg>
